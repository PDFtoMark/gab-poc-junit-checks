name: Java PR
on:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Attacker controlled test report
        run: |
          mkdir -p surefire-reports
          cat > surefire-reports/TEST-fake.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="FakeSuite" tests="1" failures="0" errors="0" skipped="0" time="0.01">
            <testcase name="totally_passing" classname="com.example.Fake" time="0.01"/>
          </testsuite>
          XML
          echo "attacker artifact content" > surefire-reports/note.txt
      - name: Upload Unit Tests Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-unit-test-results
          path: |
            **/surefire-reports/TEST-*.xml
            **/surefire-reports/*.html
